name: Release Kakao Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: kakaoguard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Generate Windows resources
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch amd64,386,arm64 --out cmd/rsrc
      - name: Build release executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($target in @(@{Arch='amd64'; Name='KakaoGuard.exe'}, @{Arch='386'; Name='KakaoGuard_i386.exe'}, @{Arch='arm64'; Name='KakaoGuard_arm64.exe'})) {
            $env:GOARCH = $target.Arch
            go build -trimpath -o ("dist/" + $target.Name) -ldflags "-H windowsgui" ./cmd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            $hash.Hash.ToLower() + '  ' + $_.Name
          } | Set-Content dist/SHA256SUMS.txt
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KakaoGuard-1.0.2-Windows
          path: dist/*
      - name: Publish v1.0.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.2 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.2 dist/KakaoGuard.exe dist/KakaoGuard_i386.exe dist/KakaoGuard_arm64.exe dist/SHA256SUMS.txt --clobber
            exit $LASTEXITCODE
          }
          $publishOutput = gh release create v1.0.2 dist/KakaoGuard.exe dist/KakaoGuard_i386.exe dist/KakaoGuard_arm64.exe dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "Kakao Guard 1.0.2" --notes "Fix startup registration permissions. Add Korean tray menus, KakaoTalk launcher, Windows startup settings, application folder shortcut, and usage information. Refresh startup state when opening the menu. Include icons and version metadata in all Windows binaries." 2>&1
          $publishCode = $LASTEXITCODE
          $publishOutput | ForEach-Object { Write-Output $_ }
          if ($publishCode -ne 0) {
            $detail = ($publishOutput | Out-String).Replace("`r", " ").Replace("`n", " ")
            Write-Output "::error::$detail"
            exit $publishCode
          }
